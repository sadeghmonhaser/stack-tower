name: Make keystore

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create keystore
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -keystore release.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias stacktower -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Stack Tower, O=StackTower, C=IR"
          base64 -w 0 release.jks > keystore.b64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.b64
